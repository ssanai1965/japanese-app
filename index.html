<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="日本語"/>
<title>日本語 フラッシュカード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #f5f0e8;
  --card-bg: #fffdf7;
  --primary: #2d4a3e;
  --primary-light: #4a7c6a;
  --accent: #c4722a;
  --accent-light: #e8935a;
  --text: #1a1a1a;
  --text-muted: #6b6b6b;
  --border: rgba(45,74,62,0.12);
  --shadow: 0 8px 32px rgba(45,74,62,0.12);
  --radius: 20px;
  --nav-h: 72px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
}

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(245,240,232,0.88);
  backdrop-filter: blur(16px);
  padding: calc(env(safe-area-inset-top) + 12px) 20px 12px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.topbar h1 { font-family: 'Noto Serif JP', serif; font-size: 20px; color: var(--primary); font-weight: 700; }
.topbar .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.topbar-btn {
  width: 40px; height: 40px; border-radius: 12px; border: none;
  background: var(--primary); color: white; font-size: 20px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s;
}
.topbar-btn:active { transform: scale(0.92); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(245,240,232,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 20px; border-radius: 14px; border: none; background: none;
  color: var(--text-muted); cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
}
.nav-item.active { color: var(--primary); background: rgba(45,74,62,0.08); }
.nav-item svg { width: 22px; height: 22px; }
.nav-item span { font-size: 10px; font-weight: 500; }

/* ── HOME SCREEN ── */
.home-hero {
  padding: 24px 20px 16px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  margin: 16px; border-radius: 24px;
  position: relative; overflow: hidden;
}
.home-hero::before {
  content: '学'; position: absolute; right: -10px; top: -20px;
  font-family: 'Noto Serif JP'; font-size: 120px; opacity: 0.08; color: white;
  font-weight: 900; line-height: 1;
}
.home-hero h2 { font-family: 'Noto Serif JP'; font-size: 26px; margin-bottom: 6px; }
.home-hero p { font-size: 13px; opacity: 0.8; margin-bottom: 20px; }
.progress-bar-wrap { background: rgba(255,255,255,0.2); border-radius: 10px; height: 8px; margin-bottom: 8px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: white; border-radius: 10px; transition: width 0.6s ease; }
.progress-label { font-size: 12px; opacity: 0.9; display: flex; justify-content: space-between; }

.home-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 10px; padding: 16px 16px 0;
}
.stat-card {
  background: var(--card-bg); border-radius: 16px; padding: 14px 10px;
  text-align: center; border: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.stat-card .num { font-family: 'Noto Serif JP'; font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-card .lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

.home-section { padding: 20px 16px 8px; }
.home-section h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }

.quick-start-btn {
  width: 100%; padding: 16px; border-radius: 16px; border: none;
  background: var(--accent); color: white;
  font-family: 'DM Sans'; font-size: 16px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 16px rgba(196,114,42,0.3); transition: all 0.2s;
}
.quick-start-btn:active { transform: scale(0.97); }

/* ── CARD LIST ── */
.card-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

.word-row {
  background: var(--card-bg); border-radius: 16px; padding: 16px;
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid var(--border); cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: all 0.2s;
  position: relative;
}
.word-row:active { transform: scale(0.98); }
.word-row.mastered { border-left: 3px solid #4CAF50; }
.word-row-left { display: flex; align-items: center; gap: 14px; }
.word-num { font-size: 10px; color: var(--text-muted); font-weight: 600; width: 28px; }
.word-jp { font-family: 'Noto Serif JP'; font-size: 26px; color: var(--primary); font-weight: 700; }
.word-info { }
.word-rom { font-size: 15px; font-weight: 600; color: var(--text); }
.word-meaning { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.word-row-right { display: flex; align-items: center; gap: 8px; }
.word-tag {
  font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 6px;
  background: rgba(45,74,62,0.08); color: var(--primary); text-transform: uppercase;
}
.sound-btn {
  width: 34px; height: 34px; border-radius: 10px; border: none;
  background: rgba(45,74,62,0.08); color: var(--primary); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.sound-btn:active { background: var(--primary); color: white; transform: scale(0.9); }

/* ── FAB ADD ── */
.fab {
  position: fixed; right: 20px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  width: 54px; height: 54px; border-radius: 16px; border: none;
  background: var(--primary); color: white; font-size: 26px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(45,74,62,0.35); transition: all 0.2s; z-index: 150;
}
.fab:active { transform: scale(0.92); }

/* ── FLASHCARD SCREEN ── */
.fc-wrap { padding: 20px 16px; display: flex; flex-direction: column; align-items: center; min-height: calc(100vh - 140px); }
.fc-progress { width: 100%; display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
.fc-progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; }
.fc-progress-fill { height: 100%; background: var(--primary); border-radius: 10px; transition: width 0.4s ease; }
.fc-count { font-size: 13px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }

.flashcard-scene { width: 100%; max-width: 360px; height: 260px; perspective: 1000px; cursor: pointer; margin-bottom: 24px; }
.flashcard {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
}
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; width: 100%; height: 100%;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 24px; padding: 32px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.flashcard-front {
  background: linear-gradient(145deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
}
.flashcard-back { background: var(--card-bg); transform: rotateY(180deg); }

.fc-kanji { font-family: 'Noto Serif JP'; font-size: 72px; font-weight: 900; margin-bottom: 8px; }
.fc-reading { font-size: 18px; opacity: 0.8; letter-spacing: 2px; }
.fc-hint { position: absolute; bottom: 16px; font-size: 11px; opacity: 0.5; }
.fc-romaji { font-family: 'DM Sans'; font-size: 28px; font-weight: 600; color: var(--primary); margin-bottom: 8px; }
.fc-meaning { font-size: 16px; color: var(--text-muted); text-align: center; margin-bottom: 16px; }
.fc-group-tag { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: rgba(45,74,62,0.1); color: var(--primary); }
.fc-example { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 10px; font-style: italic; border-top: 1px solid var(--border); padding-top: 10px; width: 100%; }

.fc-actions { display: flex; gap: 12px; width: 100%; max-width: 360px; }
.fc-btn {
  flex: 1; padding: 16px; border-radius: 16px; border: none;
  font-family: 'DM Sans'; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.fc-btn.skip { background: rgba(45,74,62,0.08); color: var(--text-muted); }
.fc-btn.know { background: var(--primary); color: white; box-shadow: 0 4px 16px rgba(45,74,62,0.25); }
.fc-btn.skip:active { transform: scale(0.96); }
.fc-btn.know:active { transform: scale(0.96); }
.fc-sound-btn {
  width: 52px; height: 52px; border-radius: 14px; border: none;
  background: rgba(196,114,42,0.1); color: var(--accent); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.fc-sound-btn:active { background: var(--accent); color: white; }

.fc-nav { display: flex; gap: 10px; margin-bottom: 16px; }
.fc-nav-btn {
  padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card-bg); cursor: pointer; font-size: 20px; transition: all 0.15s;
}
.fc-nav-btn:active { background: var(--primary); color: white; transform: scale(0.95); }

/* ── QUIZ SCREEN ── */
.quiz-wrap { padding: 20px 16px; }
.quiz-q {
  background: var(--card-bg); border-radius: 20px; padding: 28px;
  text-align: center; margin-bottom: 20px; box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.quiz-q .q-kanji { font-family: 'Noto Serif JP'; font-size: 56px; font-weight: 900; color: var(--primary); margin-bottom: 8px; }
.quiz-q .q-reading { font-size: 16px; color: var(--text-muted); }
.quiz-q .q-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 16px; }
.quiz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quiz-choice {
  padding: 16px 12px; border-radius: 14px; border: 2px solid var(--border);
  background: var(--card-bg); font-size: 14px; font-weight: 500; cursor: pointer;
  transition: all 0.2s; text-align: center; font-family: 'DM Sans';
}
.quiz-choice:active { transform: scale(0.97); }
.quiz-choice.correct { border-color: #4CAF50; background: rgba(76,175,80,0.1); color: #2e7d32; }
.quiz-choice.wrong { border-color: #f44336; background: rgba(244,67,54,0.1); color: #c62828; }
.quiz-choice.disabled { pointer-events: none; }
.quiz-score {
  text-align: center; padding: 24px; background: var(--card-bg); border-radius: 20px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.quiz-score .score-num { font-family: 'Noto Serif JP'; font-size: 64px; font-weight: 900; color: var(--primary); }
.quiz-score .score-lbl { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
.quiz-restart {
  padding: 14px 28px; border-radius: 14px; border: none;
  background: var(--primary); color: white; font-family: 'DM Sans'; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.quiz-restart:active { transform: scale(0.96); }

/* ── MODAL (ADD / EDIT WORD) ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
.modal {
  background: var(--card-bg); border-radius: 28px 28px 0 0; width: 100%; max-width: 480px;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
}
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
.modal h3 { font-family: 'Noto Serif JP'; font-size: 20px; color: var(--primary); margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--border);
  background: var(--bg); font-family: 'DM Sans'; font-size: 16px; color: var(--text);
  outline: none; transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.form-group textarea { height: 80px; resize: none; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; }
.modal-btn {
  flex: 1; padding: 15px; border-radius: 14px; border: none;
  font-family: 'DM Sans'; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.modal-btn.cancel { background: rgba(45,74,62,0.08); color: var(--text-muted); }
.modal-btn.save { background: var(--primary); color: white; box-shadow: 0 4px 16px rgba(45,74,62,0.25); }
.modal-btn:active { transform: scale(0.97); }

/* ── WORD DETAIL MODAL ── */
.detail-modal {
  background: var(--card-bg); border-radius: 28px 28px 0 0; width: 100%; max-width: 480px;
  padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
  animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
}
.detail-kanji { font-family: 'Noto Serif JP'; font-size: 80px; font-weight: 900; color: var(--primary); text-align: center; margin-bottom: 4px; }
.detail-reading { font-size: 18px; color: var(--text-muted); text-align: center; margin-bottom: 4px; }
.detail-romaji { font-size: 22px; font-weight: 600; text-align: center; color: var(--primary); margin-bottom: 16px; }
.detail-meaning { font-size: 16px; text-align: center; color: var(--text); padding: 16px; background: var(--bg); border-radius: 14px; margin-bottom: 16px; }
.detail-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.detail-row:last-of-type { border-bottom: none; }
.detail-row .lbl { color: var(--text-muted); }
.detail-row .val { font-weight: 600; color: var(--text); }
.detail-actions { display: flex; gap: 10px; margin-top: 20px; }
.detail-btn {
  flex: 1; padding: 14px; border-radius: 14px; border: none;
  font-family: 'DM Sans'; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.detail-btn.sound { background: rgba(196,114,42,0.1); color: var(--accent); }
.detail-btn.master { background: rgba(76,175,80,0.1); color: #2e7d32; }
.detail-btn.master.mastered { background: rgba(76,175,80,0.2); }
.detail-btn.edit { background: rgba(45,74,62,0.08); color: var(--primary); }
.detail-btn.del { background: rgba(244,67,54,0.08); color: #c62828; }
.detail-btn:active { transform: scale(0.96); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }

.search-wrap { padding: 12px 16px 0; }
.search-input {
  width: 100%; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--border);
  background: var(--card-bg); font-family: 'DM Sans'; font-size: 16px; color: var(--text);
  outline: none; transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--primary); }

.toast {
  position: fixed; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--primary); color: white; padding: 12px 20px; border-radius: 14px;
  font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 300;
  white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar" id="topbar">
  <div>
    <h1 id="topbar-title">日本語 単語帳</h1>
    <div class="subtitle" id="topbar-sub">플래시카드 학습</div>
  </div>
  <button class="topbar-btn" id="topbar-action" onclick="openAddModal()">＋</button>
</header>

<!-- ══ HOME SCREEN ══ -->
<div class="screen active" id="screen-home">
  <div class="home-hero">
    <h2>오늘의 학습</h2>
    <p>꾸준한 반복이 실력을 만듭니다</p>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="home-progress-bar" style="width:0%"></div>
    </div>
    <div class="progress-label">
      <span id="home-mastered-count">0개 마스터</span>
      <span id="home-total-count">전체 0개</span>
    </div>
  </div>
  <div class="home-stats">
    <div class="stat-card"><div class="num" id="stat-total">0</div><div class="lbl">전체 단어</div></div>
    <div class="stat-card"><div class="num" id="stat-mastered">0</div><div class="lbl">마스터</div></div>
    <div class="stat-card"><div class="num" id="stat-streak">0</div><div class="lbl">연속 학습</div></div>
  </div>
  <div class="home-section">
    <h3>빠른 시작</h3>
    <button class="quick-start-btn" onclick="switchScreen('flashcard')">
      <span>🃏</span> 플래시카드 학습 시작
    </button>
  </div>
  <div class="home-section">
    <h3>퀴즈</h3>
    <button class="quick-start-btn" style="background:var(--accent)" onclick="startQuiz()">
      <span>✏️</span> 퀴즈 시작하기
    </button>
  </div>
</div>

<!-- ══ WORD LIST SCREEN ══ -->
<div class="screen" id="screen-list">
  <div class="search-wrap">
    <input class="search-input" type="text" placeholder="단어 검색..." id="search-input" oninput="renderWordList()"/>
  </div>
  <div class="card-list" id="word-list"></div>
  <button class="fab" onclick="openAddModal()">＋</button>
</div>

<!-- ══ FLASHCARD SCREEN ══ -->
<div class="screen" id="screen-flashcard">
  <div class="fc-wrap">
    <div class="fc-progress">
      <div class="fc-progress-bar"><div class="fc-progress-fill" id="fc-bar" style="width:0%"></div></div>
      <div class="fc-count" id="fc-count">0 / 0</div>
    </div>
    <div class="flashcard-scene" id="fc-scene" onclick="flipCard()">
      <div class="flashcard" id="flashcard">
        <div class="flashcard-face flashcard-front">
          <div class="fc-kanji" id="fc-kanji">—</div>
          <div class="fc-reading" id="fc-reading"></div>
          <div class="fc-hint">탭하여 뒤집기 👆</div>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="fc-romaji" id="fc-romaji"></div>
          <div class="fc-meaning" id="fc-meaning"></div>
          <div class="fc-group-tag" id="fc-group"></div>
          <div class="fc-example" id="fc-example"></div>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="fc-nav-btn" onclick="prevCard()">◀</button>
      <button class="fc-sound-btn" onclick="speakCurrent()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <button class="fc-nav-btn" onclick="nextCard()">▶</button>
    </div>
    <div class="fc-actions" id="fc-actions" style="display:none">
      <button class="fc-btn skip" onclick="nextCard()">다시 볼게요</button>
      <button class="fc-btn know" onclick="markMastered()">알아요! ✓</button>
    </div>
    <div id="fc-empty" class="empty-state" style="display:none">
      <div class="icon">📚</div>
      <p>단어를 추가해주세요</p>
    </div>
  </div>
</div>

<!-- ══ QUIZ SCREEN ══ -->
<div class="screen" id="screen-quiz">
  <div class="quiz-wrap">
    <div id="quiz-card"></div>
  </div>
</div>

<!-- ══ BOTTOM NAV ══ -->
<nav class="bottom-nav">
  <button class="nav-item active" data-screen="home" onclick="switchScreen('home')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>홈</span>
  </button>
  <button class="nav-item" data-screen="list" onclick="switchScreen('list')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    <span>단어장</span>
  </button>
  <button class="nav-item" data-screen="flashcard" onclick="switchScreen('flashcard')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>

    <span>퀴즈</span>
  </button>
</nav>

<!-- ══ ADD/EDIT MODAL ══ -->
<div class="modal-overlay" id="add-modal" onclick="closeAddModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="modal-title">새 단어 추가</h3>
    <input type="hidden" id="edit-id"/>
    <div class="form-group">
      <label>한자 (漢字)</label>
      <input type="text" id="f-kanji" placeholder="예: 行"/>
    </div>
    <div class="form-group">
      <label>읽는 법 (ひらがな)</label>
      <input type="text" id="f-reading" placeholder="예: い"/>
    </div>
    <div class="form-group">
      <label>로마자 (Romaji)</label>
      <input type="text" id="f-romaji" placeholder="예: iku"/>
    </div>
    <div class="form-group">
      <label>의미 (한국어)</label>
      <input type="text" id="f-meaning" placeholder="예: 가다"/>
    </div>
    <div class="form-group">
      <label>그룹</label>
      <select id="f-group">
        <option value="Group 1">Group 1 (う동사)</option>
        <option value="Group 2">Group 2 (る동사)</option>
        <option value="Irregular">Irregular (불규칙)</option>
      </select>
    </div>
    <div class="form-group">
      <label>예문 (선택)</label>
      <textarea id="f-example" placeholder="예: 学校に行きます。(학교에 갑니다.)"></textarea>
    </div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeAddModal()">취소</button>
      <button class="modal-btn save" onclick="saveWord()">저장</button>
    </div>
  </div>
</div>

<!-- ══ DETAIL MODAL ══ -->
<div class="modal-overlay" id="detail-modal" onclick="closeDetailModal(event)">
  <div class="detail-modal">
    <div class="modal-handle"></div>
    <div class="detail-kanji" id="d-kanji"></div>
    <div class="detail-reading" id="d-reading"></div>
    <div class="detail-romaji" id="d-romaji"></div>
    <div class="detail-meaning" id="d-meaning"></div>
    <div class="detail-row"><span class="lbl">그룹</span><span class="val" id="d-group"></span></div>
    <div class="detail-row" id="d-example-row"><span class="lbl">예문</span><span class="val" id="d-example"></span></div>
    <div class="detail-row"><span class="lbl">학습 상태</span><span class="val" id="d-status"></span></div>
    <div class="detail-actions">
      <button class="detail-btn sound" onclick="speakWord(currentDetailId)">🔊 발음</button>
      <button class="detail-btn master" id="d-master-btn" onclick="toggleMaster(currentDetailId)">⭐ 마스터</button>
      <button class="detail-btn edit" onclick="openEditFromDetail()">✏️ 편집</button>
      <button class="detail-btn del" onclick="deleteWord(currentDetailId)">🗑️</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──
const DEFAULT_WORDS = [
  { id: 1, kanji: '行', reading: 'い', romaji: 'iku', meaning: '가다', group: 'Group 1', example: '学校に行きます。(학교에 갑니다.)', mastered: false },
  { id: 2, kanji: '来', reading: 'く', romaji: 'kuru', meaning: '오다', group: 'Irregular', example: '家に来てください。(집에 오세요.)', mastered: false },
  { id: 3, kanji: '食', reading: 'た', romaji: 'taberu', meaning: '먹다', group: 'Group 2', example: '朝ご飯を食べます。(아침밥을 먹습니다.)', mastered: false },
  { id: 4, kanji: '飲', reading: 'の', romaji: 'nomu', meaning: '마시다', group: 'Group 1', example: '水を飲みます。(물을 마십니다.)', mastered: false },
  { id: 5, kanji: '見', reading: 'み', romaji: 'miru', meaning: '보다', group: 'Group 2', example: 'テレビを見ます。(TV를 봅니다.)', mastered: false },
  { id: 6, kanji: '聞', reading: 'き', romaji: 'kiku', meaning: '듣다 / 묻다', group: 'Group 1', example: '音楽を聞きます。(음악을 듣습니다.)', mastered: false },
  { id: 7, kanji: '話', reading: 'はな', romaji: 'hanasu', meaning: '말하다', group: 'Group 1', example: '日本語を話します。(일본어를 말합니다.)', mastered: false },
  { id: 8, kanji: '書', reading: 'か', romaji: 'kaku', meaning: '쓰다', group: 'Group 1', example: '手紙を書きます。(편지를 씁니다.)', mastered: false },
  { id: 9, kanji: '読', reading: 'よ', romaji: 'yomu', meaning: '읽다', group: 'Group 1', example: '本を読みます。(책을 읽습니다.)', mastered: false },
  { id: 10, kanji: '寝', reading: 'ね', romaji: 'neru', meaning: '자다', group: 'Group 2', example: '早く寝ます。(일찍 잡니다.)', mastered: false },
];

let words = [];
let fcIndex = 0;
let fcDeck = [];
let quizState = { questions: [], current: 0, score: 0 };
let currentDetailId = null;
let streak = 0;

// ── STORAGE ──
function load() {
  try {
    const saved = localStorage.getItem('jp_words');
    words = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_WORDS));
    streak = parseInt(localStorage.getItem('jp_streak') || '0');
  } catch(e) { words = JSON.parse(JSON.stringify(DEFAULT_WORDS)); }
}
function save() {
  try { localStorage.setItem('jp_words', JSON.stringify(words)); } catch(e) {}
}

// ── SCREEN ──
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  const navBtn = document.querySelector(`.nav-item[data-screen="${name}"]`);
  if (navBtn) navBtn.classList.add('active');

  const fab = document.querySelector('.fab');
  const topbarBtn = document.getElementById('topbar-action');

  if (name === 'home') { updateHome(); topbarBtn.style.display='none'; if(fab) fab.style.display='none'; }
  else if (name === 'list') { renderWordList(); topbarBtn.style.display='flex'; if(fab) fab.style.display='flex'; }
  else if (name === 'flashcard') { initFlashcard(); topbarBtn.style.display='none'; if(fab) fab.style.display='none'; }
  else if (name === 'quiz') { topbarBtn.style.display='none'; if(fab) fab.style.display='none'; }

  document.getElementById('topbar-title').textContent =
    name === 'home' ? '日本語 単語帳' :
    name === 'list' ? '단어장' :
    name === 'flashcard' ? '플래시카드' : '퀴즈';
  document.getElementById('topbar-sub').textContent =
    name === 'home' ? '오늘도 한 걸음' :
    name === 'list' ? `전체 ${words.length}개` :
    name === 'flashcard' ? `${fcDeck.length}장` : '객관식 테스트';
}

// ── HOME ──
function updateHome() {
  const mastered = words.filter(w => w.mastered).length;
  const total = words.length;
  const pct = total ? Math.round(mastered / total * 100) : 0;
  document.getElementById('home-progress-bar').style.width = pct + '%';
  document.getElementById('home-mastered-count').textContent = mastered + '개 마스터';
  document.getElementById('home-total-count').textContent = '전체 ' + total + '개';
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-mastered').textContent = mastered;
  document.getElementById('stat-streak').textContent = streak;
}

// ── WORD LIST ──
function renderWordList() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = words.filter(w =>
    w.kanji.includes(q) || w.romaji.toLowerCase().includes(q) ||
    w.meaning.toLowerCase().includes(q) || w.reading.includes(q)
  );
  const el = document.getElementById('word-list');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>검색 결과가 없습니다</p></div>';
    return;
  }
  el.innerHTML = filtered.map((w, i) => `
    <div class="word-row ${w.mastered ? 'mastered' : ''}" onclick="openDetail(${w.id})">
      <div class="word-row-left">
        <span class="word-num">V${String(words.indexOf(w)+1).padStart(3,'0')}</span>
        <span class="word-jp">${w.kanji}</span>
        <div class="word-info">
          <div class="word-rom">${w.romaji}</div>
          <div class="word-meaning">${w.meaning}</div>
        </div>
      </div>
      <div class="word-row-right">
        <span class="word-tag">${w.group.replace('Group ','G')}</span>
        <button class="sound-btn" onclick="event.stopPropagation(); speakWord(${w.id})">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
      </div>
    </div>
  `).join('');
  document.getElementById('topbar-sub').textContent = `전체 ${words.length}개`;
}

// ── FLASHCARD ──
function initFlashcard() {
  fcDeck = [...words];
  if (!fcDeck.length) {
    document.getElementById('fc-empty').style.display = 'block';
    document.getElementById('fc-scene').style.display = 'none';
    document.getElementById('fc-nav').style.display = 'none';
    return;
  }
  document.getElementById('fc-empty').style.display = 'none';
  document.getElementById('fc-scene').style.display = 'block';
  document.getElementById('fc-nav').style.display = 'flex';
  fcIndex = 0;
  showFC();
}
function showFC() {
  if (!fcDeck.length) return;
  const w = fcDeck[fcIndex];
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('fc-actions').style.display = 'none';
  document.getElementById('fc-kanji').textContent = w.kanji;
  document.getElementById('fc-reading').textContent = w.reading;
  document.getElementById('fc-romaji').textContent = w.romaji;
  document.getElementById('fc-meaning').textContent = w.meaning;
  document.getElementById('fc-group').textContent = w.group;
  document.getElementById('fc-example').textContent = w.example || '';
  const pct = fcDeck.length > 1 ? Math.round(fcIndex / (fcDeck.length - 1) * 100) : 100;
  document.getElementById('fc-bar').style.width = pct + '%';
  document.getElementById('fc-count').textContent = `${fcIndex + 1} / ${fcDeck.length}`;
  document.getElementById('topbar-sub').textContent = `${fcDeck.length}장`;
}
function flipCard() {
  const fc = document.getElementById('flashcard');
  fc.classList.toggle('flipped');
  if (fc.classList.contains('flipped')) {
    document.getElementById('fc-actions').style.display = 'flex';
    speakCurrent();
  } else {
    document.getElementById('fc-actions').style.display = 'none';
  }
}
function prevCard() {
  if (fcIndex > 0) { fcIndex--; showFC(); }
}
function nextCard() {
  if (fcIndex < fcDeck.length - 1) { fcIndex++; showFC(); }
  else { showToast('마지막 카드입니다! 🎉'); }
}
function markMastered() {
  const w = fcDeck[fcIndex];
  w.mastered = true;
  const orig = words.find(x => x.id === w.id);
  if (orig) orig.mastered = true;
  save();
  streak++;
  try { localStorage.setItem('jp_streak', streak); } catch(e) {}
  showToast('마스터! ⭐ 수고했어요');
  setTimeout(() => nextCard(), 600);
}
function speakCurrent() {
  if (!fcDeck.length) return;
  speakWord(fcDeck[fcIndex].id);
}

// ── TTS ──
function speakWord(id) {
  const w = words.find(x => x.id === id);
  if (!w) return;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(w.kanji);
    utt.lang = 'ja-JP'; utt.rate = 0.85;
    const voices = window.speechSynthesis.getVoices();
    const jaVoice = voices.find(v => v.lang.startsWith('ja'));
    if (jaVoice) utt.voice = jaVoice;
    window.speechSynthesis.speak(utt);
  } else {
    showToast('이 기기에서 TTS를 지원하지 않습니다');
  }
}

// ── QUIZ ──
function startQuiz() {
  if (words.length < 4) { showToast('퀴즈를 위해 단어 4개 이상 필요합니다'); return; }
  const shuffled = [...words].sort(() => Math.random() - 0.5).slice(0, Math.min(10, words.length));
  quizState = {
    questions: shuffled.map(w => {
      const wrong = words.filter(x => x.id !== w.id).sort(() => Math.random() - 0.5).slice(0, 3);
      const choices = [...wrong.map(x => x.meaning), w.meaning].sort(() => Math.random() - 0.5);
      return { word: w, choices, answered: false };
    }),
    current: 0, score: 0
  };
  renderQuiz();
}
function renderQuiz() {
  const el = document.getElementById('quiz-card');
  if (quizState.current >= quizState.questions.length) {
    const pct = Math.round(quizState.score / quizState.questions.length * 100);
    el.innerHTML = `
      <div class="quiz-score">
        <div class="score-num">${quizState.score}/${quizState.questions.length}</div>
        <div class="score-lbl">정답률 ${pct}% ${pct >= 80 ? '🎉 훌륭해요!' : pct >= 60 ? '👍 잘했어요!' : '💪 더 연습해요'}</div>
        <button class="quiz-restart" onclick="startQuiz()">다시 풀기</button>
      </div>`;
    return;
  }
  const q = quizState.questions[quizState.current];
  el.innerHTML = `
    <div class="fc-progress" style="margin-bottom:16px">
      <div class="fc-progress-bar"><div class="fc-progress-fill" style="width:${Math.round(quizState.current/quizState.questions.length*100)}%"></div></div>
      <div class="fc-count">${quizState.current+1}/${quizState.questions.length}</div>
    </div>
    <div class="quiz-q">
      <div class="q-label">다음 단어의 의미는?</div>
      <div class="q-kanji">${q.word.kanji}</div>
      <div class="q-reading">${q.word.reading} (${q.word.romaji})</div>
    </div>
    <div class="quiz-choices">
      ${q.choices.map(c => `<button class="quiz-choice" onclick="answerQuiz('${c.replace(/'/g,"\\'")}', this)">${c}</button>`).join('')}
    </div>`;
}
function answerQuiz(chosen, btn) {
  const q = quizState.questions[quizState.current];
  if (q.answered) return;
  q.answered = true;
  const correct = q.word.meaning;
  document.querySelectorAll('.quiz-choice').forEach(b => {
    b.classList.add('disabled');
    if (b.textContent === correct) b.classList.add('correct');
  });
  if (chosen === correct) { quizState.score++; btn.classList.add('correct'); showToast('정답! ✓'); }
  else { btn.classList.add('wrong'); showToast('오답. 정답: ' + correct); }
  setTimeout(() => { quizState.current++; renderQuiz(); }, 1200);
}

// ── DETAIL MODAL ──
function openDetail(id) {
  currentDetailId = id;
  const w = words.find(x => x.id === id);
  if (!w) return;
  document.getElementById('d-kanji').textContent = w.kanji;
  document.getElementById('d-reading').textContent = w.reading;
  document.getElementById('d-romaji').textContent = w.romaji;
  document.getElementById('d-meaning').textContent = w.meaning;
  document.getElementById('d-group').textContent = w.group;
  document.getElementById('d-example').textContent = w.example || '없음';
  document.getElementById('d-status').textContent = w.mastered ? '⭐ 마스터 완료' : '학습 중';
  const mb = document.getElementById('d-master-btn');
  mb.textContent = w.mastered ? '⭐ 마스터 취소' : '⭐ 마스터 표시';
  mb.classList.toggle('mastered', w.mastered);
  document.getElementById('detail-modal').classList.add('open');
}
function closeDetailModal(e) {
  if (!e || e.target === document.getElementById('detail-modal'))
    document.getElementById('detail-modal').classList.remove('open');
}
function toggleMaster(id) {
  const w = words.find(x => x.id === id);
  if (!w) return;
  w.mastered = !w.mastered;
  save(); renderWordList(); openDetail(id);
  showToast(w.mastered ? '⭐ 마스터 완료!' : '마스터 취소');
}
function openEditFromDetail() {
  closeDetailModal();
  setTimeout(() => openEditModal(currentDetailId), 200);
}
function deleteWord(id) {
  if (!confirm('이 단어를 삭제할까요?')) return;
  words = words.filter(x => x.id !== id);
  save(); closeDetailModal(); renderWordList();
  showToast('삭제되었습니다');
}

// ── ADD / EDIT MODAL ──
function openAddModal() {
  document.getElementById('modal-title').textContent = '새 단어 추가';
  document.getElementById('edit-id').value = '';
  ['kanji','reading','romaji','meaning','example'].forEach(f => document.getElementById('f-'+f).value = '');
  document.getElementById('f-group').value = 'Group 1';
  document.getElementById('add-modal').classList.add('open');
}
function openEditModal(id) {
  const w = words.find(x => x.id === id);
  if (!w) return;
  document.getElementById('modal-title').textContent = '단어 편집';
  document.getElementById('edit-id').value = id;
  document.getElementById('f-kanji').value = w.kanji;
  document.getElementById('f-reading').value = w.reading;
  document.getElementById('f-romaji').value = w.romaji;
  document.getElementById('f-meaning').value = w.meaning;
  document.getElementById('f-group').value = w.group;
  document.getElementById('f-example').value = w.example || '';
  document.getElementById('add-modal').classList.add('open');
}
function closeAddModal(e) {
  if (!e || e.target === document.getElementById('add-modal'))
    document.getElementById('add-modal').classList.remove('open');
}
function saveWord() {
  const kanji = document.getElementById('f-kanji').value.trim();
  const reading = document.getElementById('f-reading').value.trim();
  const romaji = document.getElementById('f-romaji').value.trim();
  const meaning = document.getElementById('f-meaning').value.trim();
  if (!kanji || !romaji || !meaning) { showToast('한자, 로마자, 의미는 필수입니다'); return; }
  const editId = document.getElementById('edit-id').value;
  if (editId) {
    const w = words.find(x => x.id === parseInt(editId));
    if (w) { w.kanji=kanji; w.reading=reading; w.romaji=romaji; w.meaning=meaning; w.group=document.getElementById('f-group').value; w.example=document.getElementById('f-example').value.trim(); }
  } else {
    words.push({ id: Date.now(), kanji, reading, romaji, meaning, group: document.getElementById('f-group').value, example: document.getElementById('f-example').value.trim(), mastered: false });
  }
  save(); closeAddModal(); renderWordList();
  showToast(editId ? '수정되었습니다 ✓' : '추가되었습니다 ✓');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── INIT ──
load();
updateHome();
window.speechSynthesis?.getVoices();
document.getElementById('topbar-action').style.display = 'none';
</script>
</body>
</html>
